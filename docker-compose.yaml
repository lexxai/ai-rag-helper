# docker compose build backend && docker compose up --build -d && docker compose logs -f backend

name: ai-rag-helper
services:
  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  api:
    build:
      context: .

    volumes:
      - ./src:/app/src
      - ./data/models:/app/data/models
#      - models:/app/data/models
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - EXTRA=cpu
    env_file:
      - .env

volumes:
  redis_data:
  models: