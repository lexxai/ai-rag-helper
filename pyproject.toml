[project]
name = "ai-rag-helper"
version = "0.1.0"
description = "AI RAG Helper"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121.2",
    "pydantic-settings>=2.12.0",
    "redis[hiredis]>=7.0.1",
    "uvicorn>=0.38.0",
    "orjson>=3.11.4",
    "hf-xet>=1.2.0",
    "sentence-transformers>=5.1.2",
    "torch>=2.9.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "ruff>=0.14.2",
]
default_extras = [
    "ai-rag-helper[cpu]"
] # Group containing the extra

[project.optional-dependencies]
cpu = [
    "torch>=2.9.1",
]
cu128 = [
    "torch>=2.9.1",
]
rocm = [
    "pytorch-triton-rocm>=3.3.0; sys_platform != 'win32'",
    "torch>=2.9.1; sys_platform != 'win32'",
]
docker = [
    # Conflict group - using docker will skip torch installation
]
monitoring = [
    "prometheus-client>=0.23.1",
    "psutil>=7.1.3",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu128" },
    { extra = "rocm" },
    { extra = "docker" },
  ],
]

default-groups = ["default_extras"] # This group is installed by default with `uv sync`


[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cu128" },
  { index = "pytorch-rocm", extra = "rocm" },
]
pytorch-triton-rocm = [
  { index = "pytorch-rocm", extra = "rocm" },
]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true


# ----------------------------------------------------------------------
# 5. Code-style tools
# ----------------------------------------------------------------------
[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.flake8]
max-line-length = 120
